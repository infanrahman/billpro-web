# Root-level fallback for Railway when the service is connected directly to
# the repository instead of being configured with /backend as its root.
[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install -r backend/requirements.txt"

[deploy]
startCommand = "cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn billing_api.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
